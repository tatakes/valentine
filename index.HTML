<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будь моей валентинкой 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ffdde1, #f9c9d1);
            font-family: 'Comfortaa', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .question-screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #ffe6f0 0%, #ffd9e8 100%);
            transition: opacity 0.6s ease;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 70px 25px 70px 25px;
            box-shadow: 0 20px 45px rgba(255, 80, 120, 0.4);
            padding: 50px 40px;
            text-align: center;
            max-width: 700px;
            width: 90%;
            border: 4px solid white;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #b32e5a;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0 #ffe0f0;
            letter-spacing: 3px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .btn {
            border: none;
            background: white;
            padding: 18px 45px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 0 rgba(0,0,0,0.1), 0 10px 25px rgba(255, 30, 80, 0.4);
            transition: all 0.2s ease;
            font-family: 'Comfortaa', cursive;
            border: 3px solid white;
        }

        .yes {
            background-color: #ff7b9c;
            color: white;
            text-shadow: 3px 3px 0 #b32e5a;
            transform: scale(1);
        }

        .no {
            background-color: #d1cfcf;
            color: #5a5a5a;
            text-shadow: 1px 1px 0 white;
            box-shadow: 0 12px 0 #a1a1a1;
        }

        .no:hover {
            background-color: #c5c5c5;
            transform: scale(0.96);
        }

        .footer-hint {
            margin-top: 30px;
            color: #c1547c;
            font-size: 1.1rem;
            opacity: 0.8;
            font-style: italic;
        }

        .answer-screen {
            display: none;  
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(45deg, #ffb6c1, #ffc0cb, #ffe4e1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .answer-screen::before {
            content: "❤️💖💗💓💞💕";
            position: absolute;
            top: 5%;
            left: 5%;
            font-size: 40px;
            opacity: 0.15;
            white-space: pre;
            transform: rotate(-10deg);
        }

        .answer-screen::after {
            content: "💘💝💖💗💓💞";
            position: absolute;
            bottom: 5%;
            right: 5%;
            font-size: 50px;
            opacity: 0.15;
            transform: rotate(15deg);
        }

        .answer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 30px;
            position: relative;
            z-index: 10;
            gap: 15px;
            flex-wrap: wrap; 
        }

        .side {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 50px 20px 50px 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.3);
            border: 2px dashed white;
            height: fit-content;
            min-height: 400px;
        }

        .side.left {
            transform: rotate(-1deg);
        }

        .side.right {
            transform: rotate(1deg);
        }

        .heart-icon {
            font-size: 3.2rem;
            filter: drop-shadow(0 6px 8px rgba(200, 60, 100, 0.4));
            animation: float 3s infinite ease-in-out;
        }

        .cute-text {
            font-family: 'Pacifico', cursive;
            font-size: 1.7rem;
            color: #a1224b;
            text-shadow: 3px 3px 0 #ffe0f0;
            background: rgba(255, 240, 245, 0.7);
            padding: 10px 20px;
            border-radius: 40px;
            border: 3px solid white;
            box-shadow: 0 5px 0 #ffb3c6;
            transform: rotate(-2deg);
        }

        .side.right .cute-text {
            transform: rotate(2deg);
        }

        .small-hearts {
            font-size: 2.5rem;
            letter-spacing: 10px;
        }

        .center-image {
            flex: 0 0 auto;
            max-width: 500px;
            width: 40%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            box-shadow: 0 25px 40px rgba(255, 80, 120, 0.4);
            border: 8px solid white;
            transition: transform 0.3s;
            animation: popImage 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .center-image:hover {
            transform: scale(1.02);
        }

        .center-image img {
            width: 100%;
            height: auto;
            border-radius: 30px;
            display: block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 5px solid #ffe0f0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes popImage {
            0% { transform: scale(0.7); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 900px) {
            .answer-container {
                flex-direction: column;
                justify-content: center;
                gap: 30px;
                padding: 40px 20px;
            }

            .side {
                flex-direction: row;
                flex-wrap: wrap;
                width: 100%;
                min-height: auto;
                padding: 20px;
            }

            .center-image {
                width: 80%;
                order: -1; 
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="questionScreen" class="question-screen">
        <div class="question-card">
            <h1>💗 Ты будешь моей валентинкой? 💗</h1>
            <div class="buttons">
                <button id="btnYes" class="btn yes">ДА 💘</button>
                <button id="btnNo" class="btn no">НЕТ 💔</button>
            </div>
            <div class="footer-hint">
                ❤️ P.S. Кнопка «НЕТ» только делает кнопку «ДА» больше ❤️
            </div>
        </div>
    </div>

    <div id="answerScreen" class="answer-screen">
        <div class="answer-container">
            <div class="side left">
                <div class="heart-icon">❤️😍❤️</div>
                <div class="cute-text">ти — мой свет</div>
                <div class="small-hearts">💖💖💖</div>
                <div class="cute-text">с тобой тепло</div>
                <div class="heart-icon">💗🥰💗</div>
                <div class="cute-text">мимимимимимими</div>
                <div class="small-hearts">✨💞✨</div>
            </div>

            <div class="center-image">

                <img src="img.PNG" 
                     alt="МИ"
                     onerror="this.src='https:placekitten.com/500/500'; this.alt=''">
            </div>

            <div class="side right">
                <div class="heart-icon">💘💕💘</div>
                <div class="cute-text">люблю тибя</div>
                <div class="small-hearts">💞💞💞</div>
                <div class="cute-text">люблю бесконечно</div>
                <div class="heart-icon">💓😊💓</div>
                <div class="cute-text">счастье рядом</div>
                <div class="small-hearts">🌸💖🌸</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const questionScreen = document.getElementById('questionScreen');
            const answerScreen = document.getElementById('answerScreen');
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');

            let yesScale = 1;
            const MAX_SCALE = 3.5;

            btnNo.addEventListener('click', function() {
                if (yesScale < MAX_SCALE) {
                    yesScale += 0.2;
                    btnYes.style.transform = `scale(${yesScale})`;
                    btnYes.style.transition = 'transform 0.2s ease';
                }

                const intensity = Math.min(255, 200 + (yesScale - 1) * 30);
                btnYes.style.backgroundColor = `rgb(${intensity}, ${intensity - 50}, ${intensity - 30})`;
            });

            btnYes.addEventListener('click', function() {
                questionScreen.classList.add('hidden');
                answerScreen.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            btnNo.addEventListener('mouseenter', function() {
                btnYes.style.boxShadow = '0 0 25px #ffa5b0';
            });
            btnNo.addEventListener('mouseleave', function() {
                btnYes.style.boxShadow = '0 12px 0 rgba(0,0,0,0.1), 0 10px 25px rgba(255, 30, 80, 0.4)';
            });
        });
    </script>

    <div style="display: none;"></div>
</body>
</html>
